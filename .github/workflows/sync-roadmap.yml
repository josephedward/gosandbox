name: Sync Roadmap to Issues

on:
  push:
    paths:
      - 'roadmap.md'
  workflow_dispatch:

jobs:
  sync_roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install gitscaffold
        run: |
          pip install git+https://github.com/josephedward/gitscaffold.git

      - name: Sync roadmap.md to GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gitscaffold sync --file roadmap.md --repo josephedward/gosandbox